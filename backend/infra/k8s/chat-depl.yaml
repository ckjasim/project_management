apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-depl
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      containers:
        - name: chat
          image: jasimck/chat
          env:
            - name: JWT_SECRET
              value: "12345"
            - name: REFRESH_TOKEN_SECRET
              value: "12345"
          ports:
            - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: chat-srv
spec: 
  selector:
    app: chat
  ports:
    - name: chat
      protocol: TCP
      port: 3003
      targetPort: 3003
  type: ClusterIP