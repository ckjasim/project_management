apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-depl
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: jasimck/notification
          env:
            - name: JWT_SECRET
              value: "12345"
            - name: REFRESH_TOKEN_SECRET
              value: "12345"
          ports:
            - containerPort: 3004
---
apiVersion: v1
kind: Service
metadata:
  name: notification-srv
spec: 
  selector:
    app: notification
  ports:
    - name: notification
      protocol: TCP
      port: 3004
      targetPort: 3004
  type: ClusterIP