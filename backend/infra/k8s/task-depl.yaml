apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-depl
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: task
  template:
    metadata:
      labels:
        app: task
    spec:
      containers:
        - name: task
          image: projectManagement/task-management-service
          env:
            - name: JWT_SECRET
              value: "12345"
            - name: REFRESH_TOKEN_SECRET
              value: "12345"
---
apiVersion: v1
kind: Service
metadata:
  name: task-srv
spec: 
  selector:
    app: task
  ports:
    - name: task
      protocol: TCP
      port: 3001
      targetPort: 3000